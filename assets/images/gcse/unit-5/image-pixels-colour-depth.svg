<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Image pixels and colour depth</title>
  <desc id="desc">A simple diagram showing an image as a grid of pixels with binary colour values.</desc>
  <rect width="900" height="360" fill="#f8fbff"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#07111f">Digital images are stored as pixels</text>
  <g transform="translate(90 92)">
    <rect width="220" height="220" fill="#ffffff" stroke="#50677f" stroke-width="4"/>
    <g stroke="#50677f" stroke-width="2">
      <path d="M44 0v220M88 0v220M132 0v220M176 0v220M0 44h220M0 88h220M0 132h220M0 176h220"/>
    </g>
    <rect x="0" y="0" width="44" height="44" fill="#008da8"/>
    <rect x="44" y="0" width="44" height="44" fill="#e83e8c"/>
    <rect x="88" y="0" width="44" height="44" fill="#f4b400"/>
    <rect x="132" y="0" width="44" height="44" fill="#202733"/>
    <rect x="176" y="0" width="44" height="44" fill="#008da8"/>
    <rect x="44" y="44" width="44" height="44" fill="#f4b400"/>
    <rect x="88" y="88" width="44" height="44" fill="#e83e8c"/>
    <rect x="132" y="132" width="44" height="44" fill="#008da8"/>
    <rect x="176" y="176" width="44" height="44" fill="#202733"/>
  </g>
  <path d="M350 202h110" stroke="#008da8" stroke-width="5" stroke-linecap="round"/>
  <path d="M460 202l-16-10v20z" fill="#008da8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="500" y="100" width="300" height="205" rx="18" fill="#ffffff" stroke="#50677f" stroke-width="4"/>
    <text x="650" y="146" text-anchor="middle" font-size="25" font-weight="700" fill="#07111f">Pixel data</text>
    <text x="548" y="196" font-size="23" font-weight="700" fill="#008da8">Blue</text>
    <text x="650" y="196" font-size="23" font-weight="700" fill="#07111f">001</text>
    <text x="548" y="238" font-size="23" font-weight="700" fill="#e83e8c">Pink</text>
    <text x="650" y="238" font-size="23" font-weight="700" fill="#07111f">010</text>
    <text x="548" y="280" font-size="23" font-weight="700" fill="#f4b400">Gold</text>
    <text x="650" y="280" font-size="23" font-weight="700" fill="#07111f">011</text>
  </g>
</svg>
