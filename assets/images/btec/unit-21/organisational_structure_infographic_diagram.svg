<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Organisational structure infographic diagram</title>
  <desc id="desc">An organisation chart showing departments connected to shared business information.</desc>
  <rect width="1200" height="675" fill="#f4f7fb"/>
  <rect x="70" y="70" width="1060" height="535" rx="34" fill="#ffffff" stroke="#d8e1ec" stroke-width="4"/>
  <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">Departments work together</text>
  <text x="120" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">A change in one department can affect the process used by another.</text>
  <line x1="600" y1="260" x2="600" y2="350" stroke="#0d4f8b" stroke-width="6"/>
  <line x1="255" y1="350" x2="945" y2="350" stroke="#0d4f8b" stroke-width="6"/>
  <line x1="255" y1="350" x2="255" y2="400" stroke="#0d4f8b" stroke-width="6"/>
  <line x1="485" y1="350" x2="485" y2="400" stroke="#0d4f8b" stroke-width="6"/>
  <line x1="715" y1="350" x2="715" y2="400" stroke="#0d4f8b" stroke-width="6"/>
  <line x1="945" y1="350" x2="945" y2="400" stroke="#0d4f8b" stroke-width="6"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="420" y="220" width="360" height="80" rx="18" fill="#dcecff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="600" y="270" font-size="27" font-weight="700" fill="#142033">Organisation</text>
    <rect x="155" y="400" width="200" height="85" rx="18" fill="#fff8e8" stroke="#f2b84b" stroke-width="3"/>
    <text x="255" y="452" font-size="25" font-weight="700" fill="#142033">Sales</text>
    <rect x="385" y="400" width="200" height="85" rx="18" fill="#e7f7ee" stroke="#1e7a4d" stroke-width="3"/>
    <text x="485" y="452" font-size="25" font-weight="700" fill="#142033">Operations</text>
    <rect x="615" y="400" width="200" height="85" rx="18" fill="#eef6ff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="715" y="452" font-size="25" font-weight="700" fill="#142033">Finance</text>
    <rect x="845" y="400" width="200" height="85" rx="18" fill="#f8fafc" stroke="#5f6d7d" stroke-width="3"/>
    <text x="945" y="452" font-size="25" font-weight="700" fill="#142033">HR</text>
  </g>
  <rect x="265" y="530" width="670" height="52" rx="16" fill="#f8fafc" stroke="#d8e1ec" stroke-width="3"/>
  <text x="600" y="563" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" fill="#5f6d7d">Business processes often cross department boundaries.</text>
</svg>
