<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Process change drivers diagram</title>
  <desc id="desc">A diagram showing customer expectations, technology, competition, cost and legislation as drivers for change.</desc>
  <rect width="1200" height="675" fill="#f4f7fb"/>
  <rect x="70" y="70" width="1060" height="535" rx="34" fill="#ffffff" stroke="#d8e1ec" stroke-width="4"/>
  <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">Drivers for change</text>
  <text x="120" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">A process may need to change because the organisation’s situation has changed.</text>
  <circle cx="600" cy="365" r="82" fill="#dcecff" stroke="#0d4f8b" stroke-width="4"/>
  <text x="600" y="355" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142033">Review</text>
  <text x="600" y="388" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#5f6d7d">the process</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="160" y="250" width="230" height="70" rx="18" fill="#fff8e8" stroke="#f2b84b" stroke-width="3"/>
    <text x="275" y="294" font-size="22" font-weight="700" fill="#142033">Customers</text>
    <rect x="810" y="250" width="230" height="70" rx="18" fill="#e7f7ee" stroke="#1e7a4d" stroke-width="3"/>
    <text x="925" y="294" font-size="22" font-weight="700" fill="#142033">Technology</text>
    <rect x="135" y="450" width="260" height="70" rx="18" fill="#eef6ff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="265" y="494" font-size="22" font-weight="700" fill="#142033">Competition</text>
    <rect x="470" y="505" width="260" height="70" rx="18" fill="#f8fafc" stroke="#5f6d7d" stroke-width="3"/>
    <text x="600" y="549" font-size="22" font-weight="700" fill="#142033">Cost reduction</text>
    <rect x="805" y="450" width="260" height="70" rx="18" fill="#fff1f0" stroke="#b42318" stroke-width="3"/>
    <text x="935" y="494" font-size="22" font-weight="700" fill="#142033">Legislation</text>
  </g>
  <g stroke="#0d4f8b" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M390 285 C460 300 500 325 535 350"/>
    <path d="M810 285 C740 300 700 325 665 350"/>
    <path d="M395 485 C470 455 505 420 535 388"/>
    <path d="M600 505 V450"/>
    <path d="M805 485 C730 455 695 420 665 388"/>
  </g>
</svg>
