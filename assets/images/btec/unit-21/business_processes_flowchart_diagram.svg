<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Business processes flowchart diagram</title>
  <desc id="desc">A flowchart showing the steps in a business process from customer request to completed outcome.</desc>
  <rect width="1200" height="675" fill="#eef6ff"/>
  <rect x="70" y="70" width="1060" height="535" rx="34" fill="#ffffff" stroke="#d8e1ec" stroke-width="4"/>
  <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">A business process is a sequence</text>
  <text x="120" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">Each step depends on accurate information from the previous step.</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#0d4f8b"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="110" y="315" width="170" height="95" rx="18" fill="#dcecff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="195" y="357" font-size="22" font-weight="700" fill="#142033">Request</text>
    <text x="195" y="385" font-size="17" fill="#5f6d7d">Customer need</text>
    <rect x="355" y="315" width="170" height="95" rx="18" fill="#fff8e8" stroke="#f2b84b" stroke-width="3"/>
    <text x="440" y="357" font-size="22" font-weight="700" fill="#142033">Check</text>
    <text x="440" y="385" font-size="17" fill="#5f6d7d">Data and stock</text>
    <rect x="600" y="315" width="170" height="95" rx="18" fill="#e7f7ee" stroke="#1e7a4d" stroke-width="3"/>
    <text x="685" y="357" font-size="22" font-weight="700" fill="#142033">Process</text>
    <text x="685" y="385" font-size="17" fill="#5f6d7d">Complete work</text>
    <rect x="845" y="315" width="220" height="95" rx="18" fill="#f8fafc" stroke="#5f6d7d" stroke-width="3"/>
    <text x="955" y="357" font-size="22" font-weight="700" fill="#142033">Outcome</text>
    <text x="955" y="385" font-size="17" fill="#5f6d7d">Service delivered</text>
  </g>
  <g stroke="#0d4f8b" stroke-width="7" marker-end="url(#arrow)" fill="none" stroke-linecap="round">
    <path d="M290 362 H345"/>
    <path d="M535 362 H590"/>
    <path d="M780 362 H835"/>
  </g>
  <rect x="295" y="500" width="610" height="58" rx="18" fill="#f8fafc" stroke="#d8e1ec" stroke-width="3"/>
  <text x="600" y="537" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="middle" fill="#5f6d7d">A process model helps identify delays, errors and duplication.</text>
</svg>
