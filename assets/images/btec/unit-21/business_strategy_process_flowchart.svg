<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Business strategy process flowchart</title>
  <desc id="desc">A flowchart linking mission statement, aims, objectives, business processes and outcomes.</desc>
  <rect width="1200" height="675" fill="#eef6ff"/>
  <rect x="70" y="70" width="1060" height="535" rx="34" fill="#ffffff" stroke="#d8e1ec" stroke-width="4"/>
  <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">From purpose to process</text>
  <text x="120" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">Business aims and objectives should guide the way work is completed.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0d4f8b"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="100" y="305" width="180" height="95" rx="18" fill="#dcecff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="190" y="345" font-size="24" font-weight="700" fill="#142033">Mission</text>
    <text x="190" y="375" font-size="18" fill="#5f6d7d">Purpose</text>
    <rect x="355" y="305" width="180" height="95" rx="18" fill="#fff8e8" stroke="#f2b84b" stroke-width="3"/>
    <text x="445" y="345" font-size="24" font-weight="700" fill="#142033">Aims</text>
    <text x="445" y="375" font-size="18" fill="#5f6d7d">Broad goals</text>
    <rect x="610" y="305" width="180" height="95" rx="18" fill="#e7f7ee" stroke="#1e7a4d" stroke-width="3"/>
    <text x="700" y="345" font-size="24" font-weight="700" fill="#142033">Objectives</text>
    <text x="700" y="375" font-size="18" fill="#5f6d7d">Measurable targets</text>
    <rect x="865" y="305" width="230" height="95" rx="18" fill="#f4f7fb" stroke="#5f6d7d" stroke-width="3"/>
    <text x="980" y="345" font-size="24" font-weight="700" fill="#142033">Processes</text>
    <text x="980" y="375" font-size="18" fill="#5f6d7d">Linked activities</text>
  </g>
  <g stroke="#0d4f8b" stroke-width="7" marker-end="url(#arrow)" fill="none" stroke-linecap="round">
    <path d="M285 352 H345"/>
    <path d="M540 352 H600"/>
    <path d="M795 352 H855"/>
  </g>
  <rect x="245" y="470" width="710" height="58" rx="18" fill="#f8fafc" stroke="#d8e1ec" stroke-width="3"/>
  <text x="600" y="507" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="middle" fill="#5f6d7d">A strong recommendation must link technology to business goals.</text>
</svg>
