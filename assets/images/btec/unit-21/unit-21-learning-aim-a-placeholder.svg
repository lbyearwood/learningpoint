<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Business process modelling placeholder</title>
  <desc id="desc">A simple process flow diagram with linked business departments.</desc>
  <rect width="1200" height="675" fill="#eef6ff"/>
  <rect x="90" y="95" width="1020" height="485" rx="36" fill="#ffffff" stroke="#d8e1ec" stroke-width="4"/>
  <text x="140" y="165" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#142033">Business process model</text>
  <text x="140" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">How information moves between departments</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#142033">
    <rect x="150" y="300" width="190" height="95" rx="18" fill="#dcecff" stroke="#0d4f8b" stroke-width="3"/>
    <text x="205" y="357">Sales</text>
    <rect x="430" y="300" width="190" height="95" rx="18" fill="#fff8e8" stroke="#f2b84b" stroke-width="3"/>
    <text x="470" y="357">Operations</text>
    <rect x="710" y="300" width="190" height="95" rx="18" fill="#e7f7ee" stroke="#1e7a4d" stroke-width="3"/>
    <text x="760" y="357">Finance</text>
  </g>
  <g stroke="#0d4f8b" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M350 347 H415"/>
    <path d="M630 347 H695"/>
  </g>
  <g fill="#0d4f8b">
    <path d="M415 347 l-18 -12 v24z"/>
    <path d="M695 347 l-18 -12 v24z"/>
  </g>
  <rect x="350" y="455" width="500" height="60" rx="18" fill="#f4f7fb" stroke="#d8e1ec" stroke-width="3"/>
  <text x="390" y="494" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6d7d">Analyse the process before recommending technology</text>
</svg>
